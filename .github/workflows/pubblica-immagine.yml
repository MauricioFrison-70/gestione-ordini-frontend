name: Verifica e pubblica immagine Docker

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: immagine-frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mauriciofrison-70/gestione-ordini-frontend
  VITE_API_URL: http://127.0.0.1:8081/api

jobs:
  test:
    name: Qualita frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Scarica i sorgenti
        uses: actions/checkout@v4

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installa le dipendenze
        run: npm ci

      - name: Verifica lo stile del codice
        run: npm run lint

      - name: Esegui i test
        run: npm test -- --maxWorkers=2

      - name: Verifica il build di produzione
        run: npm run build

  e2e:
    name: Test end-to-end
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Scarica i sorgenti
        uses: actions/checkout@v4

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installa le dipendenze
        run: npm ci

      - name: Installa Chromium e le dipendenze di sistema
        run: npx playwright install --with-deps chromium

      - name: Esegui i test end-to-end
        run: npm run test:e2e

      - name: Conserva il rapporto Playwright in caso di errore
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapporto-playwright
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  pubblica:
    name: Pubblica frontend
    needs: [test, e2e]
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Scarica i sorgenti
        uses: actions/checkout@v4

      - name: Configura Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Accedi al GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Genera etichette e versioni
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Costruisci e pubblica
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          provenance: true
          sbom: true
